[project]
name = "dashcam-anonymizer"
version = "1.0.0"
description = "Blur human faces and license plates in dashcam images and videos using YOLO"
requires-python = ">=3.12"
dependencies = [
    "ultralytics>=8.3",
    "opencv-python>=4.10",
    "pyyaml>=6.0",
    "natsort",
    "rich",
]

[project.optional-dependencies]
dev = ["gdown", "pytest"]
